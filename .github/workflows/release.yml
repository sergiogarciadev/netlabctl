name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Upload Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Frontend SPA Client
        run: |
          cd client
          npm ci
          npm run build

      - name: Build Standalone Single Binary
        run: |
          go build -v -ldflags="-s -w" -o bin/netlabctl ./cmd/netlabctl

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/netlabctl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
